<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ZORVEXA – Fashion & Lifestyle shop. Order online, Cash on Delivery across Bangladesh.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e4002b">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ZORVEXA – Fashion &amp; Lifestyle</title>
<style>
:root{--bg:#fff;--fg:#111;--card:#f4f4f4;--gold:#c9a24b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d0d0d;--fg:#f2f2f2;--card:#1c1c1c}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:auto;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;max-width:480px;padding-bottom:84px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:4px}
.brand img{width:36px;height:36px;border-radius:50%}
button,.btn{font:inherit;cursor:pointer}
.lang{background:none;border:1px solid var(--gold);color:var(--gold);border-radius:20px;padding:4px 12px}
.banner{margin:0 16px;background:#000;color:var(--gold);border-radius:20px;padding:24px;font-size:20px}
input,textarea,select{width:100%;padding:11px;margin:5px 0;border-radius:12px;border:1px solid #8885;background:var(--card);color:var(--fg);font:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px}
.chip{white-space:nowrap;border:1px solid var(--gold);background:none;color:var(--fg);border-radius:20px;padding:6px 14px}
.chip.on{background:var(--gold);color:#000}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.card{background:var(--card);border-radius:16px;overflow:hidden;cursor:pointer}
.img{height:120px;display:flex;align-items:center;justify-content:center;font-size:48px;background:#8882}
.img img{width:100%;height:100%;object-fit:cover}
.card .t{padding:10px}
.p{color:var(--gold);font-weight:700}.old{text-decoration:line-through;color:#888;font-size:12px;margin-left:6px}
.sec{padding:0 16px}.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;gap:8px}
.btn{display:block;text-align:center;text-decoration:none;background:#000;color:#fff;border:1px solid var(--gold);border-radius:14px;padding:13px;width:100%;margin-top:8px}
.btn.o{background:none;color:var(--fg)}.btn.r{border-color:#d33;color:#d33;background:none}
nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:auto;display:flex;background:var(--bg);border-top:1px solid #8884;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--fg);padding:10px;font-size:12px}
nav button.on{color:var(--gold);font-weight:700}
.q button{width:32px;height:32px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--fg)}
.empty{text-align:center;padding:60px 16px;color:#888}
.logo{display:block;width:150px;height:150px;border-radius:50%;margin:10px auto}
.box{background:var(--card);border-radius:14px;padding:12px;margin:10px 0}
.small{font-size:12px;color:#888}

:root,:root:not([data-theme=light]){--bg:#04170d;--fg:#f4fff2;--card:#0b2e1b;--gold:#ffd23f}
body{background:radial-gradient(circle at 10% 0%,#0f6b3a 0,transparent 45%),radial-gradient(circle at 100% 35%,#7a5a00 0,transparent 40%),#04170d;background-attachment:fixed}
header{background:linear-gradient(120deg,#0b6b3a,#12a150 55%,#ffb300);color:#fff;border-radius:0 0 24px 24px;border-bottom:3px solid #ffd23f;margin-bottom:12px;box-shadow:0 8px 24px #12a15066}
.brand{color:#fff3b0;text-shadow:0 1px 8px #0008}
.lang{border-color:#fff3b0;color:#fff3b0}
.banner{background:linear-gradient(135deg,#0b6b3a,#12a150 60%,#ffd23f);color:#fff;text-shadow:0 2px 6px #0006;box-shadow:0 10px 28px #12a15088}
.chip{border-color:#ffd23f99;color:#fff}.chip.on{background:linear-gradient(90deg,#ffe066,#ffb300);color:#0b3a1d;border-color:transparent;font-weight:700}
.card{background:linear-gradient(160deg,#0f4a2a,#06210f);border:1px solid #ffd23f44;box-shadow:0 6px 18px #0008}
.p{color:#ffd23f}
.btn{background:linear-gradient(90deg,#ffe066,#ffb300 55%,#12a150);color:#06210f;font-weight:800;border:0;box-shadow:0 6px 18px #ffb30055}
.btn.o{background:none;color:var(--fg);border:1px solid #ffd23f;box-shadow:none}
input,textarea,select{background:#0d3a21;border:1px solid #ffd23f66;color:#fff}
nav{background:linear-gradient(180deg,#0b3a1f,#04170d);border-top:2px solid #ffd23f}
nav button.on{color:#ffd23f}
.box{background:#0b2e1b}
.q button{border-color:#ffd23f;color:#fff}
.inst{color:#06210f}
.wa{position:fixed;right:14px;bottom:74px;width:54px;height:54px;border-radius:50%;background:#25d366;color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 6px 18px #000a;z-index:9}
.inst{position:fixed;left:14px;bottom:74px;background:linear-gradient(90deg,#ffe066,#ffb300);color:#4a0008;font-weight:800;border:0;border-radius:26px;padding:13px 18px;box-shadow:0 6px 18px #000a;z-index:9}
.card.img.big{height:auto;min-height:240px;background:#0003}.card.img.big img{width:100%;height:auto;max-height:78vh;object-fit:contain}.img{height:175px}

function keepForm(){const v=[0,1,2,3,4,5,6].map(i=>document.getElementById('e'+i).value);const n=S.edit==='new';
const tmp={n:v[0],bn:v[1],c:+v[2],pr:v[3],sp:v[4],st:v[5],d:v[6]};if(n)S._d=tmp;else Object.assign(by(S.edit),tmp,{});render()}
function saveP(id){const v=[0,1,2,3,4,5,6].map(i=>document.getElementById('e'+i).value.trim());
if(!v[0]||!(+v[3]>0)){alert('নাম ও দাম দিন / Name & price required');return}
const o={n:v[0],bn:v[1],c:+v[2],pr:+v[3],sp:+v[4]||0,st:+v[5]||0,d:v[6]};if(IMG)o.img=IMG;
if(id==='new')S.products.unshift({id:'p'+Date.now().toString(36),e:'🛍️',...o});else Object.assign(by(id),o);
save();IMG='';S._d=null;go({edit:null})}
function delP(id){if(confirm('Delete? / মুছবেন?')){S.products=S.products.filter(p=>p.id!==id);delete S.cart[id];save();render()}}
function aOrd(){if(!S.orders.length)return `<div class="empty">${t('empty')}</div>`;
return S.orders.map((o,i)=>`<div class="box"><b>${o.id}</b> · ${tk(o.total)}<br>👤 ${esc(o.name)} · 📞 <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a><br>📍 ${esc(o.addr)}, ${esc(o.dist)}<br>🛒 ${esc(o.items)}${o.note?`<br>📝 ${esc(o.note)}`:''}
<select onchange="S.orders[${i}].s=+this.value;save();render()">${ST.map((s,k)=>`<option value="${k}" ${o.s===k?'selected':''}>${s[0]} / ${s[1]}</option>`).join('')}</select></div>`).join('')}
function aCat(){return `<div class="box"><input id="c0" placeholder="Category (English)"><input id="c1" placeholder="ক্যাটাগরি (বাংলা, ঐচ্ছিক)"><button class="btn" onclick="addC()">＋ Add category</button></div>${S.cats.map((c,i)=>`<div class="row"><span>${esc(c[0])} / ${esc(c[1])}</span><button class="chip" onclick="delC(${i})">🗑</button></div>`).join('')}`}
function addC(){const a=document.getElementById('c0').value.trim(),b=document.getElementById('c1').value.trim();if(!a)return;S.cats.push([a,b||a]);save();render()}
function delC(i){if(S.products.some(p=>p.c===i)){alert('এই ক্যাটাগরিতে পণ্য আছে / Category has products');return}
S.products.forEach(p=>{if(p.c>i)p.c--});S.cats.splice(i,1);S.cat=-1;save();render()}
function aSet(){return `<div class="box"><b>📞 Contact number / যোগাযোগের নম্বর</b><input id="s0" type="tel" placeholder="+8801XXXXXXXXX" value="${esc(S.phone)}"><b>🚚 ঢাকা জেলায় ডেলিভারি চার্জ ৳</b><input id="s1" type="number" value="${S.dIn}"><b>🚚 ঢাকার বাইরে ডেলিভারি চার্জ ৳</b><input id="s2" type="number" value="${S.dOut}"><button class="btn" onclick="saveS()">Save</button></div><div class="box"><b>🔑 নতুন পাসওয়ার্ড / New password</b><input id="s3" type="text" maxlength="30" autocomplete="off" placeholder="৬–৩০ অক্ষর, ইংরেজি বা সংখ্যা"><button class="btn" onclick="chgPin()">পাসওয়ার্ড সেভ করুন / Save password</button></div><p class="small">Coupons, banners, sales stats: next version.</p>`}
function chgPin(){const v=document.getElementById('s3').value.trim();if(v.length<6||v.length>30){alert('৬ থেকে ৩০ অক্ষর দিন / Use 6 to 30 characters');return}S.pin=v;save();document.getElementById('s3').value='';alert('✓ নতুন পাসওয়ার্ড সেভ হয়েছে / Password saved')}
function saveS(){S.phone=document.getElementById('s0').value.trim();S.dIn=+document.getElementById('s1').value||0;S.dOut=+document.getElementById('s2').value||0;save();alert('✓');render()}
function render(keep){const a=document.getElementById('app');
if(keep){const el=document.getElementById('q'),pos=el.selectionStart;a.innerHTML=home();const n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos);return}
a.innerHTML=S.view?detail():{home,cart,orders,checkout,me,admin}[S.tab]();
document.getElementById('lang').textContent=S.bn?'EN':'বাংলা';
const n=Object.keys(S.cart).length;
document.getElementById('nav').innerHTML=[['home','🏠'],['cart','🛍️'],['orders','📦'],['me','👤']].map(([k,i])=>`<button class="${(S.tab===k||(k==='me'&&S.tab==='admin'))&&!S.view?'on':''}" onclick="go({tab:'${k}',view:null})">${i}<br>${t(k)}${k==='cart'&&n?' ('+n+')':''}</button>`).join('')}
document.getElementById('lang').onclick=()=>{S.bn=!S.bn;save();render()};
{const hv=hashView();if(hv)S.view=hv}
addEventListener('hashchange',()=>{const hv=hashView();if(hv){S.view=hv;render()}});
render();

let _ip=null;const _ib=document.getElementById('inst');
if(!(matchMedia('(display-mode: standalone)').matches||navigator.standalone)){_ib.style.display='block'}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();_ip=e});
addEventListener('appinstalled',()=>{_ib.style.display='none'});
_ib.onclick=async()=>{if(_ip){_ip.prompt();await _ip.userChoice;_ip=null}else{alert(/iphone|ipad|ipod/i.test(navigator.userAgent)?'Safari-তে Share (⬆️) চাপুন → "Add to Home Screen"':'ব্রাউজারের ⋮ মেনু চাপুন → "Install app" বা "Add to Home screen" চাপুন')}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

{const b2=document.getElementById('inst2');if(b2){if(_ib.style.display==='block')b2.style.display='inline-block';b2.onclick=_ib.onclick;addEventListener('appinstalled',()=>{b2.style.display='none'})}}
</script></body></html>
